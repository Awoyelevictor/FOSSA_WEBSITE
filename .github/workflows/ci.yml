name: FOSSA CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and reconcile the existing lockfile
        run: npm install --no-audit --no-fund
      - name: Check backend JavaScript syntax
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build frontend and production server
        run: npm run build
